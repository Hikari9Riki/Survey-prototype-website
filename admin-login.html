<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — RoadSense</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-logo">🚗</span>
        <span>RoadSense</span>
      </a>
      <nav class="topbar-links">
        <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="auth-wrap">
      <div class="card">
        <h1 class="card-title" style="text-align:center;">🔐 Admin Login</h1>
        <p class="card-subtitle" style="text-align:center;">Sign in to view and manage survey results.</p>

        <div id="login-error" class="alert alert-info hidden"></div>

        <form id="login-form" autocomplete="off">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="input" placeholder="admin@demo.com" required />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="input" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <div class="divider">or</div>

        <button type="button" id="google-login" class="btn google-btn btn-block">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Sign in with Google
        </button>

        <p class="muted text-center mt-20" style="font-size:13px;">
          Demo credentials: <code>admin@demo.com</code> / <code>admin123</code>
        </p>
      </div>
    </div>
  </main>

  <!-- Simulated Google account picker -->
  <div class="modal-overlay" id="google-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Choose an account</h3>
        <button class="modal-close" id="google-close">&times;</button>
      </div>
      <p class="muted mb-20">This is a simulated Google sign-in for the prototype.</p>
      <button type="button" class="btn btn-outline btn-block" style="margin-bottom:10px;" data-google-user="Admin Google" data-google-email="admin.google@gmail.com">
        <span style="display:flex;align-items:center;gap:10px;">
          <span style="width:28px;height:28px;border-radius:50%;background:#0ea5e9;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">A</span>
          Admin Google <span class="muted">admin.google@gmail.com</span>
        </span>
      </button>
      <button type="button" class="btn btn-outline btn-block" data-google-user="RoadSense Admin" data-google-email="roadsense.admin@gmail.com">
        <span style="display:flex;align-items:center;gap:10px;">
          <span style="width:28px;height:28px;border-radius:50%;background:#f97316;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">R</span>
          RoadSense Admin <span class="muted">roadsense.admin@gmail.com</span>
        </span>
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
